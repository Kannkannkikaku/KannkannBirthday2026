# 11/16 12:00（日本時間）に本番用の内容へ自動で切り替える
# ・本番用のコミットは非公開リポジトリ（KannkannBirthday2026-release）の release-1116 ブランチに置いてある
# ・開始が遅れても間に合うよう 11:17 ごろに起動し、12:00:00 まで待ってから取り込む
# ・すでに取り込み済みなら何もしない（2回目の予約・手動実行が重なっても安全）
# ・手動実行（Run workflow）でも 12:00 より前は待つ。dry_run=true なら取り込みの確認だけで公開しない
name: 本番切り替え（11/16 12:00）

on:
  schedule:
    - cron: '17 2 16 11 *'   # 11/16 02:17 UTC = 11:17 JST
    - cron: '43 2 16 11 *'   # 予備：11:43 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '確認だけ（公開しない）'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: release-switch
  cancel-in-progress: false

env:
  RELEASE_AT_UTC: '2026-11-16 03:00:00'
  RELEASE_REPO: Kannkannkikaku/KannkannBirthday2026-release
  RELEASE_BRANCH: release-1116

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 取り込み済みか確認
        id: check
        run: |
          if git log --format=%s | grep -q '^\[本番用\]'; then
            echo "すでに本番用に切り替わっています"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 本番用のコミットを取得して取り込む（まだ公開しない）
        if: steps.check.outputs.done != 'true'
        env:
          TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::鍵が見つかりません。Settings → Secrets and variables → Actions に RELEASE_REPO_TOKEN が登録されているか確認してください"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_TERMINAL_PROMPT=0
          # 鍵で非公開リポジトリが見えるかを確認（401=鍵が無効・古い／404=鍵は有効だが対象リポジトリが違う）
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" "https://api.github.com/repos/${RELEASE_REPO}")
          echo "非公開リポジトリの確認: ${code}"
          if [ "$code" = "401" ]; then
            echo "::error::鍵が無効です（${code}）。作り直した新しいトークンを RELEASE_REPO_TOKEN に登録し直してください"
            exit 1
          elif [ "$code" != "200" ]; then
            echo "::error::鍵は有効ですが、非公開リポジトリが見えません（${code}）。トークンの Repository access で KannkannBirthday2026-release を選んでいるか確認してください"
            exit 1
          fi
          # checkout が設定した公開リポジトリ用の認証ヘッダーを、この取得のときだけ外す（外さないと鍵が使われない）
          if ! git -c "http.https://github.com/.extraheader=" fetch --quiet "https://${GITHUB_REPOSITORY_OWNER}:${TOKEN}@github.com/${RELEASE_REPO}.git" "${RELEASE_BRANCH}"; then
            echo "::error::リポジトリは見えますが、中身を読めませんでした。トークンの権限で Contents が Read-only になっているか確認してください"
            exit 1
          fi
          git log --oneline -1 FETCH_HEAD
          if ! git cherry-pick FETCH_HEAD; then
            echo "::error::本番用のコミットを取り込めませんでした（競合）。main が変更されていないか確認してください"
            exit 1
          fi
          git log --oneline -2

      - name: 公開できるか確認（dry_run）
        if: steps.check.outputs.done != 'true' && inputs.dry_run
        run: |
          git push --dry-run origin HEAD:main
          echo "確認OK（dry_run のため公開はしていません）"

      - name: 12:00 まで待つ
        if: steps.check.outputs.done != 'true' && !inputs.dry_run
        run: |
          target=$(date -u -d "${RELEASE_AT_UTC}" +%s)
          now=$(date -u +%s)
          if [ "$now" -lt "$target" ]; then
            echo "$((target - now)) 秒待ちます"
            sleep $((target - now))
          fi
          date

      - name: 公開する
        if: steps.check.outputs.done != 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:main
          # 念のため GitHub Pages の再構築も依頼する
          curl -s -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
          date
